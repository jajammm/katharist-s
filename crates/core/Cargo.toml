[package]
name = "katharistis-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "katharistis_core"

[dependencies]
rayon = "1"
sha2 = "0.10"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
