[package]
name = "katharistis-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "katharistis-gui"
path = "src/main.rs"

[dependencies]
katharistis-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.37", default-features = false }
windows = { version = "0.62", features = ["Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"
